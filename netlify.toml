# Netlify deployment config for the Safety Document Generator.
# The app is a Vite + React + TypeScript SPA that builds to dist/.
#
# Setup: app.netlify.com -> Add new site -> Import from Git -> pick this repo.
# Netlify is free for private repositories. These settings are detected
# automatically from this file; no dashboard configuration is needed.

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so a refresh on any path still serves the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the static icon/image assets; they are content-stable.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
